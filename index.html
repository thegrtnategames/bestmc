<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World MC | Minecraft Player Rankings for Java & Bedrock</title>
  <meta name="description" content="Explore World MC, a Minecraft player index featuring Java, Bedrock, Dungeons, and Legends rankings.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#080a09">
  <meta property="og:type" content="website">
  <meta property="og:title" content="World MC | Minecraft Player Rankings">
  <meta property="og:description" content="Explore Minecraft player rankings across Java, Bedrock, Dungeons, and Legends.">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=topmc-adjust-6">
</head>
<body>
  <div class="site-shell">
    <div id="player-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-name">
        <button class="modal-close" type="button" aria-label="Close profile">×</button>
        <div class="modal-header">
          <img id="modal-skin" src="" alt="Player skin" class="modal-skin">
          <div>
            <div class="modal-rank" id="modal-rank">#1</div>
            <h3 id="modal-name">Player</h3>
            <div id="modal-lane" class="modal-lane"></div>
          </div>
        </div>
        <div class="modal-body">
          <div class="modal-section">
            <h4>About</h4>
            <p id="modal-bio"></p>
          </div>
          <div class="modal-section">
            <h4>Socials</h4>
            <div id="modal-socials" class="socials"></div>
          </div>
        </div>
      </div>
    </div>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <h1 class="title-topmc" aria-label="World MC">
            <span class="topmc-letter topmc-w" data-letter="W">W</span>
            <span class="topmc-letter topmc-o" data-letter="O">O</span>
            <span class="topmc-letter topmc-r" data-letter="R">R</span>
            <span class="topmc-letter topmc-l" data-letter="L">L</span>
            <span class="topmc-letter topmc-d" data-letter="D">D</span>
            <span class="topmc-letter topmc-m" data-letter="M">M</span>
            <span class="topmc-letter topmc-c" data-letter="C">C</span>
          </h1>
        </div>
      </section>

      <section class="rankings" id="rankings" aria-labelledby="rankings-title">
        <div id="podium" class="podium"></div>
        <div class="controls">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search the legend vault..." autocomplete="off"><kbd>/</kbd></label>
          <div class="edition-switch" id="editions" role="group" aria-label="Minecraft edition"></div>
          <div class="filter-row" id="filters" role="group" aria-label="Filter players"></div>
          <div class="sort-wrap"><label for="sort">Sort</label><select id="sort"><option value="rank">Rank</option><option value="alpha">A–Z</option><option value="lane">Lane</option></select></div>
        </div>
        <div class="player-grid" id="player-grid"></div>
        <button class="load-more" id="load-more" type="button">Load more legends <span>+</span></button>
      </section>
    </main>

    <footer><span>WORLD MC / FAN-MADE</span><span>Built for the people who built the world.</span></footer>
  </div>
  <script src="app.js?v=topmc-adjust-6"></script>
</body>
</html>
